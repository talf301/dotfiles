[project]
name = "symphony"
version = "0.1.0"
description = "Tal's Symphony: Linear tickets run by Codex agents (see docs/PLAN.md)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "python-liquid>=1.12,<2",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
symphony = "symphony.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["symphony"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
